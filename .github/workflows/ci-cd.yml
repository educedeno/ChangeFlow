name: CI/CD

# Triggers:
#   - PR a `dev`           → solo lint + tests (CI)
#   - push a `dev`         → lint + tests + build/push imagenes :dev + redeploy Render dev
#   - push de tag `v*.*.*` → lint + tests + build/push imagenes :prod y :vX.Y.Z + redeploy Render prod
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    tags: ['v*.*.*']

jobs:
  # -------------------------------------------------------------------------
  # CI — corre en todos los eventos. Best-effort mientras no haya codigo real.
  # -------------------------------------------------------------------------
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install tooling
        run: pip install ruff pytest

      - name: Lint (best-effort)
        # `|| true` mientras los modulos esten vacios; quitar cuando exista codigo real
        run: ruff check backend/ frontend/ || true

      - name: Tests (best-effort)
        # pytest sale con codigo 5 si no encuentra tests; tolerado de momento
        run: pytest backend/app/tests/ || true

  # -------------------------------------------------------------------------
  # CD parte 1 — build y push de las dos imagenes a Docker Hub.
  # Solo en push (no en PR). Tags se calculan segun el evento.
  # -------------------------------------------------------------------------
  build-and-push:
    if: github.event_name == 'push'
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/changeflow-${{ matrix.service }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMAGE}:prod,${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # -------------------------------------------------------------------------
  # CD parte 2 — disparar deploy hooks de Render. Dispara backend y frontend
  # juntos para que ambos servicios se redeployen al mismo tiempo.
  # -------------------------------------------------------------------------
  deploy-render:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy dev
        if: github.ref == 'refs/heads/dev'
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEV_BACKEND_HOOK }}"
          curl -fsSL -X POST "${{ secrets.RENDER_DEV_FRONTEND_HOOK }}"

      - name: Deploy prod
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_PROD_BACKEND_HOOK }}"
          curl -fsSL -X POST "${{ secrets.RENDER_PROD_FRONTEND_HOOK }}"
